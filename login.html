<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Videoteca</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

  <!-- Contenedor Principal Split-Screen -->
  <div class="login-container">
    
    <!-- LADO IZQUIERDO: Imagen / Arte de fondo -->
    <div class="login-hero">
      <div class="hero-text">
        <h2>Bienvenido de nuevo</h2>
        <p>Explora la experiencia de nuestra plataforma.</p>
      </div>
    </div>

    <!-- LADO DERECHO: Panel de Formulario -->
    <div class="login-panel">
      <div class="login-content">
        
        <!-- Logo -->
        <div class="login-logo">
          <img src="LOGO%20INSTITUCIONAL/SVG/UCEN%20LOGO_UCEN_ISO.svg" alt="Logo de Universidad Central">
        </div>

        <h1 class="login-title">Videoteca</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder</p>

        <!-- CAMBIO 2: Se agregó id="login-form" y se quitó action="index.html" -->
        <form id="login-form" class="login-form">
          
          <!-- Campo Correo -->
          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
          </div>

          <!-- Campo Contraseña -->
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <!-- Olvidaste contraseña -->
          <div class="forgot-password">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Acceder -->
          <button type="submit" class="btn-submit">Acceder</button>

        </form>
        <p id="login-status" role="status" aria-live="polite"></p>

      </div>
    </div>

  </div>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { sendPasswordResetEmail, signInWithEmailAndPassword, signOut } from "firebase/auth";
    import { doc, getDoc } from "firebase/firestore";

    const form = document.querySelector("#login-form");
    const status = document.querySelector("#login-status");
    const emailInput = form.querySelector("#email");
    const passwordInput = form.querySelector("#password");

    // Auth valida las credenciales; el perfil Firestore define el rol de la aplicación.
    async function redirectByRole(user) {
      const profile = await getDoc(doc(db, "usuarios", user.uid));
      const role = profile.exists() ? profile.data().role : "";
      if (role === "profesor") window.location.href = "Vista/Profesor/main.html";
      else if (role === "alumno") window.location.href = "index.html";
      else {
        await signOut(auth);
        status.textContent = `Esta cuenta no tiene rol configurado. Añade usuarios/${user.uid} en Firestore con role: profesor o alumno.`;
      }
    }

    // Espera a restaurar la sesión persistida antes de decidir qué vista abrir.
    await auth.authStateReady();
    if (auth.currentUser) await redirectByRole(auth.currentUser);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      status.textContent = "Verificando acceso...";
      try {
        const credential = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        await redirectByRole(credential.user);
      } catch (error) {
        status.textContent = error.code === "auth/invalid-credential"
          ? "Correo o contraseña incorrectos."
          : "No se pudo iniciar sesión. Comprueba la cuenta y la conexión con Firebase.";
        button.disabled = false;
      }
    });

    document.querySelector(".forgot-password a").addEventListener("click", async (event) => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) {
        status.textContent = "Escribe tu correo para solicitar el restablecimiento de contraseña.";
        emailInput.focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        status.textContent = "Si la cuenta existe, recibirás un correo para restablecer la contraseña.";
      } catch {
        status.textContent = "No se pudo enviar el correo de restablecimiento.";
      }
    });
  </script>

</body>
</html>
