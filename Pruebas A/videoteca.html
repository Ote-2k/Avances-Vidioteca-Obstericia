<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Videoteca - Nombre de la Página</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="videoteca-body">

  <!-- Cabecera -->
  <header class="site-header">
    <h1 class="site-title">Nombre de la Página</h1>

  <!-- Área principal centrada -->

    <div class="video-wrapper">
      <!-- Reproductor con video de muestra -->
      <video controls poster="https://via.placeholder.com/1280x720/111/fff?text=Cargando+Video...">

        Tu navegador no soporta el reproductor de video HTML5.
      </video>
    </div>
  </main>

</body>
