<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Opción B</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor Principal Split-Screen -->
  <div class="login-container">
    
    <!-- LADO IZQUIERDO: Imagen / Arte de fondo -->
    <div class="login-hero">
      <div class="hero-text">
        <h2>Bienvenido de nuevo</h2>
        <p>Explora la experiencia de nuestra plataforma.</p>
      </div>
    </div>

    <!-- LADO DERECHO: Panel de Formulario -->
    <div class="login-panel">
      <div class="login-content">
        
        <!-- Logo -->
        <div class="login-logo">
          <img src="https://via.placeholder.com/80" alt="Logo de la página">
        </div>

        <!-- Nombre de la página -->
        <h1 class="login-title">Nombre de la Página</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder</p>

        <!-- Formulario visual (redirige directamente a index.html) -->
        <form action="index.html" class="login-form">
          
          <!-- Campo Correo -->
          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com">
          </div>

          <!-- Campo Contraseña -->
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>

          <!-- Olvidaste contraseña -->
          <div class="forgot-password">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Acceder -->
          <button type="submit" class="btn-submit">Acceder</button>

        </form>

      </div>
    </div>

  </div>

</body>
</html>
