<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>window.location.replace("/login");</script>
  <title>Acceso | Videoteca</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

  <!-- Contenedor Principal Split-Screen -->
  <div class="login-container">
    
    <!-- LADO IZQUIERDO: Imagen / Arte de fondo -->
    <div class="login-hero">
      <div class="hero-text">
        <h2>Obstetricia y Puericultura</h2>
        <p>Facultad de Medicina y Ciencias de la Salud</p>
      </div>
    </div>

    <!-- LADO DERECHO: Panel de Formulario -->
    <div class="login-panel">
      <div class="login-content">
        
        <!-- Logo -->
        <div class="login-logo">
          <img src="LOGO%20INSTITUCIONAL/SVG/UCEN%20LOGO_UCEN_ISO_BLANCO.svg" alt="Logo de Universidad Central">
        </div>

        <h1 class="login-title">Videoteca Ucen</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder</p>

        <!-- CAMBIO 2: Se agregó id="login-form" y se quitó action="index.html" -->
        <form id="login-form" class="login-form">
          
          <!-- Campo Correo -->
          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
          </div>

          <!-- Campo Contraseña -->
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <!-- Olvidaste contraseña -->
          <div class="forgot-password">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>
		  
		  <!-- Botón Acceder -->
          <button type="submit" class="btn-submit">Acceder</button>
		  
		  <div style="text-align: center; margin-top: 0 px;">
			  <a href="registro.html" style="color: var(--color-8); font-size: 0.85rem; text-decoration: none;">
				¿Eres estudiante? <strong style="color: var(--color-4);">Crea tu cuenta aquí</strong>
			  </a>
		  </div>

        </form>
        <p id="login-status" role="status" aria-live="polite"></p>

      </div>
    </div>

  </div>

</body>
</html>
