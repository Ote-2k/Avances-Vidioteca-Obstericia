<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignaturas | Videoteca UCEN</title>
  <script>
    if (window.location.pathname === "/") window.location.replace("login.html");
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="index-body">

  <header class="site-header">
    <h1 class="site-title">Videoteca UCEN</h1>
    <div class="student-profile">
      <div class="user-badge-info">
        <strong id="student-user-name">Estudiante</strong>
        <span class="badge-role">Alumno</span>
      </div>
      <button id="btn-logout" class="btn-logout" type="button">Cerrar sesión</button>
    </div>
  </header>

  <div class="student-layout">
    <aside class="student-sidebar" aria-label="Asignaturas disponibles">
      <h2>Asignaturas</h2>
      <nav class="student-assignment-list" id="student-assignment-list"></nav>
    </aside>

    <main class="student-main">
      <h1 id="student-course-title">Asignaturas</h1>
      <p class="student-status" id="student-status" role="status" aria-live="polite">Cargando asignaturas...</p>
      <div id="student-course-content"></div>
    </main>
  </div>

  <script type="module" src="Vista/Alumno/student-home.js"></script>
</body>
</html>
