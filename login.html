<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Opción B</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- CAMBIO 1: Script en el <head> para redirigir si YA inició sesión -->
  <script>
    if (localStorage.getItem("sesionIniciada")) {
      window.location.href = "index.html";
    }
  </script>
</head>
<body>

  <!-- Contenedor Principal Split-Screen -->
  <div class="login-container">
    
    <!-- LADO IZQUIERDO: Imagen / Arte de fondo -->
    <div class="login-hero">
      <div class="hero-text">
        <h2>Bienvenido de nuevo</h2>
        <p>Explora la experiencia de nuestra plataforma.</p>
      </div>
    </div>

    <!-- LADO DERECHO: Panel de Formulario -->
    <div class="login-panel">
      <div class="login-content">
        
        <!-- Logo -->
        <div class="login-logo">
          <img src="https://via.placeholder.com/80" alt="Logo de la página">
        </div>

        <!-- Nombre de la página -->
        <h1 class="login-title">Nombre de la Página</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder</p>

        <!-- CAMBIO 2: Se agregó id="login-form" y se quitó action="index.html" -->
        <form id="login-form" class="login-form">
          
          <!-- Campo Correo -->
          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
          </div>

          <!-- Campo Contraseña -->
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <!-- Olvidaste contraseña -->
          <div class="forgot-password">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Acceder -->
          <button type="submit" class="btn-submit">Acceder</button>

        </form>

      </div>
    </div>

  </div>

  <!-- CAMBIO 3: Script de autenticación justo antes de cerrar </body> -->
  <script>
    const form = document.getElementById('login-form');

    form.addEventListener('submit', function (event) {
      event.preventDefault(); // Evita que la página se recargue inmediatamente

      // Guarda la marca de sesión en el navegador
      localStorage.setItem('sesionIniciada', 'true');

      // Redirige al inicio
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
