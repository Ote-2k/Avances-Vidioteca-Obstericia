<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Videoteca</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>

  <!-- Contenedor Principal Split-Screen -->
  <div class="login-container">
    
    <!-- LADO IZQUIERDO: Imagen / Arte de fondo -->
    <div class="login-hero">
      <div class="hero-text">
        <h2>Bienvenido de nuevo</h2>
        <p>Explora la experiencia de nuestra plataforma.</p>
      </div>
    </div>

    <!-- LADO DERECHO: Panel de Formulario -->
    <div class="login-panel">
      <div class="login-content">
        
        <!-- Logo -->
        <div class="login-logo">
          <img src="LOGO%20INSTITUCIONAL/SVG/UCEN%20LOGO_UCEN_ISO.svg" alt="Logo de Universidad Central">
        </div>

        <h1 class="login-title">Videoteca</h1>
        <p class="login-subtitle">Ingresa tus credenciales para acceder</p>

        <!-- CAMBIO 2: Se agregó id="login-form" y se quitó action="index.html" -->
        <form id="login-form" class="login-form">
          
          <!-- Campo Correo -->
          <div class="input-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="ejemplo@correo.com" required>
          </div>

          <!-- Campo Contraseña -->
          <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <!-- Olvidaste contraseña -->
          <div class="forgot-password">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Acceder -->
          <button type="submit" class="btn-submit">Acceder</button>

        </form>
        <p class="login-subtitle">Demo local: profesor@videoteca.demo / Profesor123! · alumno@videoteca.demo / Alumno123!</p>
        <p id="login-status" role="status" aria-live="polite"></p>

      </div>
    </div>

  </div>

  <script type="module">
    const form = document.querySelector("#login-form");
    const status = document.querySelector("#login-status");
    const demoAccounts = {
      "profesor@videoteca.demo": { password: "Profesor123!", role: "profesor" },
      "alumno@videoteca.demo": { password: "Alumno123!", role: "alumno" }
    };
    const currentRole = localStorage.getItem("videotecaDemoRole");
    if (currentRole === "profesor") window.location.href = "Vista/Profesor/main.html";
    if (currentRole === "alumno") window.location.href = "index.html";

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      const email = form.elements.email.value.trim().toLowerCase();
      const account = demoAccounts[email];
      if (!account || form.elements.password.value !== account.password) {
        status.textContent = "Correo o contraseña incorrectos.";
        button.disabled = false;
        return;
      }
      localStorage.setItem("videotecaDemoRole", account.role);
      localStorage.setItem("videotecaDemoEmail", email);
      localStorage.setItem("sesionIniciada", "true");
      window.location.href = account.role === "profesor" ? "Vista/Profesor/main.html" : "index.html";
    });
  </script>

</body>
</html>
