<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Panel del profesor | Videoteca</title>
	<style>
		:root {
			color-scheme: light;
			--page: #f5f5f4;
			--surface: #ffffff;
			--line: #e5e5e4;
			--text: #292927;
			--muted: #777773;
			--soft: #f0f0ee;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-width: 320px;
			min-height: 100vh;
			background: var(--page);
			color: var(--text);
			font-family: Arial, Helvetica, sans-serif;
			font-size: 14px;
		}

		button, select { font: inherit; }

		.topbar {
			height: 64px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 32px;
			background: var(--surface);
			border-bottom: 1px solid var(--line);
		}

		.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; }
		.brand img { width: 36px; height: 36px; object-fit: contain; }
		.brand-name { color: var(--text); font-weight: 700; }
		.brand-role { color: var(--muted); font-weight: 400; }
		.profile { display: flex; align-items: center; gap: 10px; color: var(--muted); }
		.logout-button { padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
		.avatar {
			width: 32px;
			height: 32px;
			display: grid;
			place-items: center;
			border: 1px solid var(--line);
			border-radius: 50%;
			background: var(--soft);
			color: var(--text);
			font-size: 12px;
			font-weight: 700;
		}

		.layout { min-height: calc(100vh - 64px); display: flex; }

		.sidebar {
			width: 260px;
			flex: 0 0 260px;
			padding: 28px 18px;
			background: var(--surface);
			border-right: 1px solid var(--line);
		}

		.side-label {
			margin: 0 0 10px;
			color: var(--muted);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: .06em;
			text-transform: uppercase;
		}

		.course-list {
			list-style: none;
			margin: 0;
			padding: 0;
		}

		.course-list li {
			margin-top: 4px;
			border-radius: 4px;
			color: #555550;
		}

		.course-list a,
		.course-list .course-name {
			display: block;
			padding: 11px 12px;
			border-radius: 4px;
			color: inherit;
			text-decoration: none;
		}
		.assignment-management { max-width: 860px; }
		.assignment-create-form { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 28px; }
		.assignment-create-form input, .assignment-row input { min-width: 0; padding: 10px 11px; border: 1px solid #d6d6d3; border-radius: 4px; background: #fff; color: var(--text); font: inherit; }
		.assignment-create-form input { flex: 1 1 260px; }
		.assignment-create-form button, .assignment-row button { padding: 10px 14px; border: 1px solid #d6d6d3; border-radius: 4px; background: var(--soft); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; }
		.assignment-create-form button:hover, .assignment-row button:hover { background: #e8e8e5; }
		.assignment-management-list { display: grid; }
		.assignment-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 1.15fr) auto; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
		.assignment-row:first-child { border-top: 1px solid var(--line); }
		.assignment-row > a { color: var(--text); font-size: 15px; font-weight: 600; text-decoration: none; }
		.assignment-row > a:hover { text-decoration: underline; text-underline-offset: 3px; }
		.assignment-row form { display: flex; gap: 8px; }
		.assignment-row input { flex: 1; }
		.assignment-row .assignment-delete { border-color: #e2b6b2; background: #fff; color: #8e3028; }
		.assignment-row .assignment-delete:hover { background: #fff1ef; }
		.assignment-count { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
		.assignment-status { min-height: 18px; margin: 14px 0 0; color: var(--muted); font-size: 12px; }
		.assignment-empty { margin: 0; padding: 18px 0; border-top: 1px solid var(--line); color: var(--muted); }
		.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

		.course-list a:hover { background: var(--soft); }

		.sidebar-link {
			display: block;
			margin-bottom: 26px;
			padding: 11px 12px;
			border-radius: 4px;
			background: var(--soft);
			color: var(--text);
			font-weight: 700;
			text-decoration: none;
		}

		main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 48px 48px 64px; }
		h1 { margin: 0; font-size: 28px; font-weight: 600; }
		.main-heading { margin-bottom: 30px; }

		@media (max-width: 720px) {
			.topbar { height: 58px; padding: 0 18px; }
			.layout { min-height: calc(100vh - 58px); flex-direction: column; }
			.sidebar { width: 100%; flex-basis: auto; padding: 18px; border-right: 0; border-bottom: 1px solid var(--line); }
			main { padding: 32px 20px 44px; }
			.assignment-row { grid-template-columns: 1fr; gap: 10px; }
			.assignment-row form { flex-wrap: wrap; }
			.assignment-row .assignment-delete { justify-self: start; }
		}
	</style>
</head>
<body>
	<header class="topbar">
		<div class="brand">
			<img src="../../LOGO%20INSTITUCIONAL/SVG/UCEN%20LOGO_UCEN_ISO.svg" alt="Logo de Universidad Central">
			<span class="brand-name">Videoteca</span>
			<span class="brand-role">· Profesor</span>
		</div>
		<div class="profile">
			<span>Profesor</span>
			<span class="avatar" aria-hidden="true">P</span>
			<button class="logout-button" id="demo-logout" type="button">Salir</button>
		</div>
	</header>

	<div class="layout">
		<aside class="sidebar" id="asignaturas" aria-label="Asignaturas del profesor">
			<p class="side-label">Mis asignaturas</p>
			<ul class="course-list" aria-label="Asignaturas"></ul>
		</aside>

		<main id="inicio">
			<section class="assignment-management" aria-labelledby="assignment-management-title">
				<header class="main-heading">
					<h1 id="assignment-management-title">Mis asignaturas</h1>
					<p class="assignment-count" id="assignment-count"></p>
				</header>
				<form class="assignment-create-form" id="assignment-create-form">
					<label class="visually-hidden" for="assignment-name-input">Nombre de la nueva asignatura</label>
					<input id="assignment-name-input" name="title" maxlength="80" placeholder="Nueva asignatura" required>
					<button type="submit">Crear asignatura</button>
				</form>
				<div class="assignment-management-list" id="assignment-management-list"></div>
				<p class="assignment-status" id="assignment-status" role="status" aria-live="polite"></p>
			</section>
		</main>
	</div>
	<script type="module" src="course-manager.js"></script>
</body>
</html>
