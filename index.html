<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asignaturas | Videoteca</title>
  <script>
    if (window.location.pathname === "/") window.location.replace("login.html");
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .student-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 64px); }
    .student-sidebar { padding: 28px 18px; border-right: 1px solid #e5e5e4; background: #fff; }
    .student-sidebar h2 { margin: 0 0 16px; font-size: 15px; }
    .student-assignment-list { display: grid; gap: 6px; }
    .student-assignment, .student-unit-tree { min-width: 0; }
    .student-assignment > summary, .student-unit-tree > summary { padding: 10px 12px; border-radius: 4px; color: #374151; cursor: pointer; }
    .student-assignment > summary { background: #e5e7eb; font-weight: 600; }
    .student-assignment[open] > summary, .student-assignment > summary:hover { color: #111827; }
    .student-unit-tree { margin-top: 5px; }
    .student-unit-tree > summary { display: flex; justify-content: space-between; gap: 10px; background: #f3f4f6; color: #4b5563; font-size: 13px; }
    .student-unit-tree > summary span { color: #6b7280; font-size: 11px; white-space: nowrap; }
    .student-resource-list { display: grid; gap: 2px; padding: 4px 0 6px 14px; }
    .student-resource-link { display: block; padding: 6px 8px; border-radius: 4px; color: #2563eb; font-size: 13px; text-decoration: none; }
    .student-resource-link[aria-current="page"], .student-resource-link:hover { background: #e0e7ff; color: #1d4ed8; }
    .student-main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 40px; }
    .student-main h1 { margin: 0 0 8px; font-size: 27px; }
    .student-status { min-height: 20px; margin: 0 0 24px; color: #777; font-size: 13px; }
    .student-classes-title { margin: 30px 0 16px; font-size: 18px; }
    .student-unit { margin: 24px 0 0; }
    .student-unit-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
    .student-unit-heading h3 { margin: 0; font-size: 15px; }
    .student-unit-heading span { color: #777; font-size: 12px; }
    .student-resource-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .student-resource-card { overflow: hidden; border: 1px solid #e5e5e4; border-radius: 4px; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s ease, transform .15s ease; }
    .student-resource-card:hover { border-color: #9ca3af; transform: translateY(-2px); }
    .student-resource-card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #f0f0ee; }
    .student-resource-content { padding: 14px; }
    .student-resource-content h3 { margin: 0 0 6px; font-size: 15px; }
    .student-resource-content p { margin: 0; color: #777; font-size: 12px; }
    .student-empty { padding: 16px 0; color: #777; }
    .student-profile { display: flex; align-items: center; gap: 12px; }
    @media (max-width: 760px) {
      .student-layout { grid-template-columns: 1fr; }
      .student-sidebar { border-right: 0; border-bottom: 1px solid #e5e5e4; }
      .student-main { padding: 28px 18px; }
      .student-resource-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }
    @media (max-width: 480px) { .student-resource-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="index-body">
  <header class="site-header">
    <h1 class="site-title">Videoteca</h1>
    <div class="student-profile">
      <span>Alumno</span>
      <button id="btn-logout" class="btn-logout" type="button">Cerrar sesiÃ³n</button>
    </div>
  </header>
  <div class="student-layout">
    <aside class="student-sidebar" aria-label="Asignaturas disponibles">
      <h2>Asignaturas</h2>
      <nav class="student-assignment-list" id="student-assignment-list"></nav>
    </aside>
    <main class="student-main">
      <h1 id="student-course-title">Asignaturas</h1>
      <p class="student-status" id="student-status" role="status" aria-live="polite">Cargando asignaturas...</p>
      <div id="student-course-content"></div>
    </main>
  </div>
  <script type="module" src="Vista/Alumno/student-home.js"></script>
</body>
</html>
