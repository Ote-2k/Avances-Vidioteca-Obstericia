<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Opción A</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">

  <!-- Tarjeta central de Login -->
  <div class="login-card">
    
    <!-- Logo -->
    <div class="login-logo">
      <img src="https://via.placeholder.com/80" alt="Logo de la página">
    </div>

    <!-- Nombre de la página -->
    <h1 class="login-title">Nombre de la Página</h1>
    <p class="login-subtitle">Bienvenido, ingresa tus datos</p>

    <!-- Formulario visual (redirige directamente a index.html) -->
    <form action="index.html" class="login-form">
      
      <!-- Campo Correo -->
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com">
      </div>

      <!-- Campo Contraseña -->
      <div class="input-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <!-- Olvidaste contraseña -->
      <div class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón de Acceder -->
      <button type="submit" class="btn-submit">Acceder</button>

    </form>
  </div>

</body>
</html>
